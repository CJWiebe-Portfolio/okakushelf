# Sveltia CMS config for Otaku Shelf.
# Docs: https://github.com/sveltia/sveltia-cms
#
# Every save in the admin becomes a commit on the `main` branch of the
# GitHub repo below; GitHub Pages then redeploys the site (about 1–2 min).

backend:
  name: github
  repo: CJWiebe-Portfolio/okakushelf
  branch: main
  base_url: https://sveltia-cms-auth.cygnus-wiebe.workers.dev
  commit_messages:
    update: "Update {{collection}} “{{slug}}” via CMS"
    uploadMedia: "Upload “{{path}}” via CMS"
    deleteMedia: "Delete “{{path}}” via CMS"

# Uploaded photos are committed here; the path stored in figures.json is
# relative (no leading slash) so it works on a GitHub Pages project URL.
media_folder: assets/statues/web
public_folder: assets/statues/web

# Resize + compress photos in the browser before they're committed,
# so phone photos don't bloat the repo.
media_libraries:
  default:
    config:
      max_file_size: 20000000
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1600
          height: 1600

collections:
  - name: shelf
    label: Shelf
    description: The figures shown in the gallery.
    editor:
      preview: false
    files:
      - name: figures
        label: Figures
        file: data/figures.json
        format: json
        fields:
          - name: figures
            label: Figures
            label_singular: Figure
            widget: list
            add_to_top: true
            summary: "{{fields.name}} — {{fields.series}}"
            fields:
              - { name: name, label: Name, widget: string }
              - {
                  name: series,
                  label: Series / Franchise,
                  widget: string,
                  required: false,
                }
              - {
                  name: sculptor,
                  label: Sculptor / Manufacturer,
                  widget: string,
                  required: false,
                }
              - name: scale
                label: Scale
                widget: string
                required: false
                hint: e.g. 1/7 Scale, Nendoroid, Non-scale
              - name: height_mm
                label: Height (mm)
                widget: number
                value_type: float
                min: 1
                required: false
                hint: Whole figure including the base, in millimetres (250 = 25 cm). Adds size comparisons to the site.
              - name: width_mm
                label: Width (mm)
                widget: number
                value_type: float
                min: 1
                required: false
                hint: Optional. Widest point, in millimetres.
              - name: depth_mm
                label: Depth (mm)
                widget: number
                value_type: float
                min: 1
                required: false
                hint: Optional. Front to back, in millimetres.
              - name: dateAdded
                label: Date added
                widget: datetime
                format: YYYY-MM-DD
                time_format: false
                default: "{{now}}"
              - name: description
                label: Description
                widget: text
                required: false
                hint: Notes, backstory, condition, where you got it, etc.
              - { name: image, label: Main photo, widget: image, choose_url: false }
              - name: photos
                label: More photos
                label_singular: Photo
                widget: list
                required: false
                hint: Optional extra angles or close-ups. Shown after the main photo.
                field: { name: photo, label: Photo, widget: image, choose_url: false }
              - name: featured
                label: Feature on the home page
                widget: boolean
                default: false
                hint: Only one figure should be featured — if several are ticked, the newest one wins.
      - name: reference_items
        label: Comparison items
        file: data/reference-items.json
        format: json
        fields:
          - name: items
            label: Items
            label_singular: Item
            widget: list
            add_to_top: true
            summary: "{{fields.name}}"
            hint: Everyday objects that figures are compared against. Sizes are in millimetres; give at least one of height, width or depth.
            fields:
              - { name: name, label: Name, widget: string }
              - name: height_mm
                label: Height (mm)
                widget: number
                value_type: float
                min: 0.1
                required: false
              - name: width_mm
                label: Width (mm)
                widget: number
                value_type: float
                min: 0.1
                required: false
              - name: depth_mm
                label: Depth (mm)
                widget: number
                value_type: float
                min: 0.1
                required: false
              - name: band
                label: Size band
                widget: select
                options: [tiny, small, medium, large, xlarge, huge]
                default: small
                hint: "Figures are compared with items in their own band and the next one up. Roughly: tiny under 4 cm, small under 20 cm, medium under 50 cm, large under 1.6 m, xlarge under 3 m, huge beyond."
              - name: adjustable
                label: Adjustable height
                widget: boolean
                default: false
                required: false
                hint: Shows a slider so visitors can change this item's height (used for "Person").
